services:
  - type: web
    name: cuteflow-project-hub
    runtime: static
    branch: main
    buildCommand: mkdir -p dist && cp index.html styles.css app.js dist/ && cp -r data dist/
    staticPublishPath: ./dist
    headers:
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
